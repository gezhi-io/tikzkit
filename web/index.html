<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikZKit Workbench</title>
<link rel="stylesheet" href="/styles.css">
<script type="importmap">
{
  "imports": {
    "chevrotain": "/vendor/chevrotain/chevrotain.mjs",
    "katex": "/vendor/katex/katex.mjs"
  }
}
</script>
<script type="module" src="/app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-group fixture-controls">
      <label for="fixture-select">Case</label>
      <select id="fixture-select"></select>
      <input id="fixture-filter" type="search" placeholder="Filter cases" autocomplete="off" aria-label="Filter cases">
      <button id="new-source-button" type="button">New source</button>
    </div>
    <div class="toolbar-group render-controls">
      <button id="render-button" type="button">Render</button>
      <button id="reset-source-button" type="button" disabled>Reset</button>
      <button id="copy-svg-button" type="button" disabled>Copy SVG</button>
      <button id="download-svg-button" type="button" disabled>Download SVG</button>
      <label class="toggle"><input id="grid-toggle" type="checkbox" checked> 1cm grid</label>
    </div>
    <output id="render-status" aria-live="polite">Ready</output>
  </header>
  <main class="workbench">
    <section class="editor-pane" aria-label="TikZ source">
      <header class="editor-heading">
        <div>
          <h1 id="fixture-title">TikZ source</h1>
          <p id="fixture-summary">Choose a case or start a new source.</p>
        </div>
        <output id="draft-status" aria-live="polite"></output>
      </header>
      <section class="semantic-inventory" aria-label="Semantic inventory">
        <details id="semantic-details">
          <summary>
            <span>Semantic inventory</span>
            <output id="semantic-summary" aria-live="polite">Loading source inventory</output>
          </summary>
          <div id="semantic-content" class="semantic-content"></div>
        </details>
      </section>
      <textarea id="source-editor" spellcheck="false" aria-label="TikZ source editor"></textarea>
      <section id="diagnostics" class="diagnostics" aria-label="Diagnostics"></section>
    </section>
    <section class="preview-pane" aria-label="Render comparison">
      <article class="preview-column">
        <h2 id="tikzkit-heading">TikZKit browser SVG</h2>
        <div id="tikzkit-result" class="render-surface"></div>
      </article>
      <article class="preview-column">
        <h2 id="reference-heading">tikztosvg reference</h2>
        <div class="reference-surface">
          <object id="reference-result" class="render-surface" type="image/svg+xml"></object>
          <p id="reference-empty" class="reference-empty" hidden></p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
