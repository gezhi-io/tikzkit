<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikZKit Web Test</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>TikZKit Web Test</h1>
        <p>案例源码统一来自 <code>web/cases.md</code>，输出统一写入 <code>web/output/</code>。</p>
      </div>
      <div class="actions">
        <select id="case-select" aria-label="选择 TikZ case"></select>
        <button id="render-button" type="button">Render</button>
      </div>
    </header>

    <main class="workspace">
      <section class="editor-pane">
        <div class="pane-header">
          <label for="source-input">TikZ source</label>
          <span>Ctrl/Cmd+A 可直接替换代码</span>
        </div>
        <div class="editor-shell" data-editor="codemirror-style">
          <pre id="line-numbers" class="line-numbers" aria-hidden="true"></pre>
          <textarea id="source-input" spellcheck="false" aria-label="TikZ source editor"></textarea>
        </div>
      </section>

      <section class="preview-pane">
        <div class="preview-header">
          <strong id="case-title">Preview</strong>
          <span id="status-line"></span>
        </div>
        <nav id="output-artifacts" class="output-artifacts" aria-label="输出文件"></nav>
        <div id="preview" class="preview"></div>
        <div id="diagnostics" class="diagnostics"></div>
      </section>
    </main>

    <script type="module" src="/web/app.js"></script>
  </body>
</html>
